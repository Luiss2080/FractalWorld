name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # Compila todo src/ (incluida la interfaz Swing, sin abrir ventanas) y ejecuta JUnit.
      - name: Compilar y probar
        run: mvn -B verify

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-surefire
          path: target/surefire-reports/
